repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix]
        files: ^backend/
        stages: [pre-commit]
      - id: ruff-format
        name: ruff (format)
        files: ^backend/
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
        stages: [pre-commit]
