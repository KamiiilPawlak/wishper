services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wishper
      POSTGRES_PASSWORD: wishper
      POSTGRES_DB: wishper
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishper -d wishper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
